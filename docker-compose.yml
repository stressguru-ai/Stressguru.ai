version: "3.8"

services:
  # ── MySQL Database ──────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: stressguru
      MYSQL_USER: stressguru
      MYSQL_PASSWORD: stressguru_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── StressGuru App ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_ vars are baked into the frontend bundle at build time.
        # Set these in your .env file before running docker-compose build.
        VITE_APP_ID: ${VITE_APP_ID:-}
        VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-}
        VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY:-}
        VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL:-}
        VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT:-}
        VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID:-}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-StressGuru}
        VITE_APP_LOGO: ${VITE_APP_LOGO:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to point at the compose db service
      DATABASE_URL: mysql://stressguru:stressguru_pass@db:3306/stressguru
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
